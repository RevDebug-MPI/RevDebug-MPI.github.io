<header class="site-header" role="banner">
    <div class="wrapper">
        <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>

        <nav class="site-nav">
            <div class="trigger">
                <a class="page-link {% if page.url == '/' %}active-tab{% endif %}" href="{{ '/' | relative_url }}">Overview</a>
                <a class="page-link {% if page.url contains 'architecture' %}active-tab{% endif %}"
                   href="{{ '/architecture.html' | relative_url }}">Architecture</a>
                <a class="page-link {% if page.url contains 'installation' %}active-tab{% endif %}"
                   href="{{ '/installation.html' | relative_url }}">Installation</a>
                <a class="page-link {% if page.url contains 'demo' %}active-tab{% endif %}"
                   href="{{ '/demo.html' | relative_url }}">Demo</a>
                <a class="page-link {% if page.url contains 'publications' %}active-tab{% endif %}"
                   href="{{ '/publications.html' | relative_url }}">Publications</a>
            </div>
        </nav>
    </div>
</header>
